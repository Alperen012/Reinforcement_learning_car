[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "racing-gym"
version = "0.2.0"
description = "A readable 2D racing environment and playground for learning reinforcement learning."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=0.29.1",
    "numpy>=1.26",
    "pygame>=2.5",
    "stable-baselines3>=2.3",
    "matplotlib>=3.7",
    "pillow>=10",
    "tensorboard>=2.15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
racing-gym = "racing_gym.cli:main"

[tool.setuptools]
packages = ["racing_gym"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "SIM"]
# SIM115: the training callback keeps its CSV files open for the whole run.
# B905: zip() over equal-length sequences everywhere; strict= adds noise. SIM108: readability.
ignore = ["E731", "SIM115", "B905", "SIM108"]
